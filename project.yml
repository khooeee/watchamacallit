name: Watchamacallit

options:
  deploymentTarget:
    watchOS: "11.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  Watchamacallit:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: Watchamacallit
        excludes:
          - Info.plist
          - AppSecrets.swift.template
    info:
      path: Watchamacallit/Info.plist
      properties:
        CFBundleDisplayName: Watchamacallit
        NSMicrophoneUsageDescription: Watchamacallit uses the microphone while voice mode is on.
        UIBackgroundModes:
          - audio
        WKApplication: true
        WKWatchOnly: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khooeee.watchamacallit
        DEVELOPMENT_TEAM: W2DS3T67VP
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        SKIP_INSTALL: false
        TARGETED_DEVICE_FAMILY: 4
        SWIFT_EMIT_LOC_STRINGS: true
        SWIFT_STRICT_CONCURRENCY: minimal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          ENABLE_PREVIEWS: true
        Release:
          VALIDATE_PRODUCT: true

schemes:
  Watchamacallit:
    build:
      targets:
        Watchamacallit: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
